<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220" fill="none">
  <defs>
    <linearGradient id="ticketPinkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FFF5F8"/>
      <stop offset="100%" stop-color="#FCE4EC"/>
    </linearGradient>
    <filter id="ticketShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#8C475A" flood-opacity="0.18"/>
    </filter>
  </defs>

  <g filter="url(#ticketShadow)">
    <!-- Marco Exterior con borde festoneado de encaje -->
    <rect x="15" y="15" width="290" height="190" rx="20" fill="url(#ticketPinkGrad)" stroke="#E8A7B8" stroke-width="2"/>
    <rect x="23" y="23" width="274" height="174" rx="14" fill="none" stroke="#D4AF37" stroke-width="1.2" stroke-dasharray="3 3"/>

    <!-- Coronas y lazos en las esquinas -->
    <circle cx="36" cy="36" r="3" fill="#D4AF37"/>
    <circle cx="284" cy="36" r="3" fill="#D4AF37"/>
    <circle cx="36" cy="184" r="3" fill="#D4AF37"/>
    <circle cx="284" cy="184" r="3" fill="#D4AF37"/>

    <!-- Contenido tipográfico de la fecha -->
    <text x="160" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#9E4D60" letter-spacing="3" text-anchor="middle">SÁBADO</text>
    
    <!-- Gran Número 24 -->
    <text x="160" y="118" font-family="'Playfair Display', Georgia, serif" font-size="62" font-weight="800" fill="#9E4D60" text-anchor="middle">24</text>
    
    <!-- Mes y Año -->
    <text x="160" y="148" font-family="'Playfair Display', Georgia, serif" font-size="22" font-weight="700" fill="#422933" text-anchor="middle" letter-spacing="1">Octubre</text>
    
    <text x="160" y="174" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#D4AF37" text-anchor="middle" letter-spacing="2">2026 &#8226; 4:00 PM</text>
  </g>
</svg>
