<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="360" height="480" fill="none">
  <defs>
    <linearGradient id="goldFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEAB8"/>
      <stop offset="30%" stop-color="#D4AF37"/>
      <stop offset="65%" stop-color="#9E7824"/>
      <stop offset="100%" stop-color="#C9A028"/>
    </linearGradient>
    <radialGradient id="mirrorGlass" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#F9F5F0"/>
      <stop offset="85%" stop-color="#F2E6DA"/>
      <stop offset="100%" stop-color="#E5D1BE"/>
    </radialGradient>
    <filter id="mirrorShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#4A2E12" flood-opacity="0.2"/>
    </filter>
  </defs>

  <g filter="url(#mirrorShadow)">
    <!-- Marco Exterior con Moldura Barroca Dorada -->
    <ellipse cx="180" cy="240" rx="155" ry="215" fill="url(#goldFrame)"/>
    <ellipse cx="180" cy="240" rx="142" ry="202" fill="#75521A"/>
    <ellipse cx="180" cy="240" rx="136" ry="196" fill="url(#goldFrame)"/>
    <ellipse cx="180" cy="240" rx="122" ry="182" fill="#9E7824"/>
    
    <!-- Espejo / Fondo Interior de Porcelana Marfil -->
    <ellipse cx="180" cy="240" rx="118" ry="178" fill="url(#mirrorGlass)"/>

    <!-- Detalle de cuentas doradas perladas alrededor del espejo -->
    <ellipse cx="180" cy="240" rx="120" ry="180" stroke="#FFF7D6" stroke-width="2" stroke-dasharray="3 6" fill="none"/>

    <!-- Adorno superior barroco de corona / concha -->
    <g transform="translate(180, 20)">
      <path d="M-30 20 C-20 0, 0 -8, 0 -8 C0 -8, 20 0, 30 20 C18 14, 0 16, 0 16 C0 16, -18 14, -30 20 Z" fill="url(#goldFrame)"/>
      <circle cx="0" cy="6" r="6" fill="#F4D3DC" stroke="url(#goldFrame)" stroke-width="1.5"/>
    </g>

    <!-- Rosas decorativas en la esquina inferior izquierda -->
    <g transform="translate(45, 380)">
      <circle cx="20" cy="20" r="22" fill="#C47F95" opacity="0.9"/>
      <circle cx="20" cy="20" r="14" fill="#924245"/>
      <circle cx="20" cy="20" r="7" fill="#F4D3DC"/>
      <path d="M5 38 Q-10 45 0 55 Q18 48 5 38 Z" fill="#758A65"/>
      <path d="M38 12 Q52 5 48 20 Q36 22 38 12 Z" fill="#758A65"/>
    </g>

    <!-- Rosas decorativas en la esquina superior derecha -->
    <g transform="translate(265, 55)">
      <circle cx="20" cy="20" r="18" fill="#C47F95" opacity="0.9"/>
      <circle cx="20" cy="20" r="11" fill="#924245"/>
      <circle cx="20" cy="20" r="5" fill="#F4D3DC"/>
      <path d="M35 15 Q50 10 45 25 Q32 25 35 15 Z" fill="#758A65"/>
    </g>
  </g>
</svg>
