<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" width="220" height="260" fill="none">
  <defs>
    <linearGradient id="brassKey" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E4B2"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#9E7824"/>
      <stop offset="100%" stop-color="#BF9730"/>
    </linearGradient>
    <linearGradient id="tagPaper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF8"/>
      <stop offset="100%" stop-color="#EFE2CE"/>
    </linearGradient>
    <filter id="keyShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#4A3018" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#keyShadow)">
    <!-- Cordón o cinta que sostiene la etiqueta -->
    <path d="M110 90 Q85 115 65 140" stroke="#7A4B23" stroke-width="2.5" stroke-dasharray="1 1" fill="none"/>
    <path d="M110 90 Q95 125 70 148" stroke="#5C3615" stroke-width="1.8" fill="none"/>

    <!-- Etiqueta de equipaje vintage (luggage tag) -->
    <g transform="translate(20, 135) rotate(-14)">
      <!-- Sombra de la etiqueta -->
      <polygon points="12,0 80,0 95,24 80,48 12,48 0,24" fill="url(#tagPaper)" stroke="#A98758" stroke-width="1.5"/>
      <circle cx="15" cy="24" r="3.5" fill="#5C3615"/>
      <text x="50" y="28" font-family="'Playfair Display', Georgia, serif" font-size="11" font-weight="700" fill="#6A3B18" text-anchor="middle" letter-spacing="0.5">To: Emma</text>
    </g>

    <!-- Cabeza ornamental de la llave (Bow) -->
    <g transform="translate(10, 0)">
      <circle cx="120" cy="55" r="36" fill="url(#brassKey)"/>
      <circle cx="120" cy="55" r="24" fill="#F8F3ED"/>
      
      <!-- Detalle interior trébol / filigrana -->
      <circle cx="120" cy="46" r="8" fill="url(#brassKey)"/>
      <circle cx="111" cy="62" r="8" fill="url(#brassKey)"/>
      <circle cx="129" cy="62" r="8" fill="url(#brassKey)"/>
      <circle cx="120" cy="57" r="4" fill="#F8F3ED"/>

      <!-- Tallo / Vástago de la llave -->
      <rect x="115" y="85" width="10" height="135" rx="3" fill="url(#brassKey)"/>
      <rect x="113" y="90" width="14" height="6" rx="2" fill="url(#brassKey)"/>
      <rect x="113" y="105" width="14" height="4" rx="2" fill="url(#brassKey)"/>

      <!-- Dientes de la llave (Bit) con diseño de castillo -->
      <path d="M125 180 H148 V192 H136 V198 H146 V208 H134 V214 H148 V222 H125 Z" fill="url(#brassKey)"/>
      <!-- Acento brillante -->
      <line x1="117" y1="92" x2="117" y2="218" stroke="#FFF7D6" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    </g>
  </g>
</svg>
