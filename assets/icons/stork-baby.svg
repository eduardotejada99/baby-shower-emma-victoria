<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="300" height="240" fill="none">
  <defs>
    <radialGradient id="cloudGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#FFF0F5"/>
      <stop offset="100%" stop-color="#FCE4EC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="storkBeak" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9A825"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="blanketPink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD6E0"/>
      <stop offset="50%" stop-color="#F7AEC3"/>
      <stop offset="100%" stop-color="#E5829D"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#D892A4" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#softGlow)">
    <!-- Nubes suaves de fondo -->
    <path d="M40 180 C30 165, 50 145, 75 150 C85 130, 120 130, 135 150 C155 145, 175 160, 165 180 Z" fill="url(#cloudGlow)" opacity="0.8"/>
    <path d="M160 70 C150 55, 170 35, 195 40 C205 20, 240 20, 255 40 C275 35, 295 50, 285 70 Z" fill="url(#cloudGlow)" opacity="0.7"/>

    <!-- Cigüeña en Vuelo -->
    <g transform="translate(30, 20)">
      <!-- Pata trasera y delantera estiradas -->
      <path d="M60 115 L25 145" stroke="#E65100" stroke-width="3" stroke-linecap="round"/>
      <path d="M62 118 L30 152" stroke="#EF6C00" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Cuerpo de la cigüeña en blanco puro -->
      <path d="M60 115 C55 90, 80 75, 110 80 C135 85, 150 100, 140 120 C125 135, 80 135, 60 115 Z" fill="#FFFFFF" stroke="#E0D3D8" stroke-width="1.5"/>

      <!-- Cola con plumitas negras elegantes -->
      <path d="M55 110 L35 115 L45 125 Z" fill="#3A3035"/>
      <path d="M45 118 L30 125 L42 130 Z" fill="#52434A"/>

      <!-- Ala superior desplegada hacia arriba -->
      <path d="M95 82 C105 45, 135 15, 170 10 C165 35, 145 65, 125 85 Z" fill="#FFFFFF" stroke="#E0D3D8" stroke-width="1.5"/>
      <!-- Puntas negras del ala -->
      <path d="M145 22 C158 14, 170 10, 170 10 C165 35, 152 48, 145 22 Z" fill="#3A3035"/>
      <path d="M135 42 C145 32, 158 24, 158 24 C152 46, 140 58, 135 42 Z" fill="#52434A"/>

      <!-- Cuello grácil y cabeza -->
      <path d="M135 90 C155 85, 175 75, 190 65 C198 60, 205 65, 202 75 C195 90, 170 105, 145 105 Z" fill="#FFFFFF" stroke="#E0D3D8" stroke-width="1.2"/>
      
      <!-- Ojo dulce con pestañita -->
      <circle cx="196" cy="68" r="2.5" fill="#3A2530"/>
      <circle cx="197" cy="67" r="0.8" fill="#FFFFFF"/>

      <!-- Pico largo sosteniendo la atadura -->
      <path d="M202 70 L255 82 L202 76 Z" fill="url(#storkBeak)"/>

      <!-- Corona de princesa en miniatura sobre la cigüeña -->
      <path d="M190 56 L194 62 L200 54 L204 62 L208 56 L206 64 L192 64 Z" fill="#D4AF37"/>
    </g>

    <!-- Paquete / Manta Rosada de la Bebé colgando del pico -->
    <g transform="translate(205, 95)">
      <!-- Nudo superior de la manta -->
      <path d="M10 0 C5 -8, 20 -8, 15 0 C18 8, 8 10, 10 0 Z" fill="#C47F95"/>
      
      <!-- Lazo con puntas flotantes -->
      <path d="M12 2 C22 0, 28 8, 22 14 C18 10, 15 6, 12 2 Z" fill="#F7AEC3"/>
      <path d="M8 2 C-2 0, -8 8, -2 14 C2 10, 5 6, 8 2 Z" fill="#F7AEC3"/>

      <!-- El saquito acunado con la silueta de la bebé -->
      <path d="M-8 12 C-25 35, -20 70, 8 72 C35 74, 45 40, 28 14 C18 20, 2 20, -8 12 Z" fill="url(#blanketPink)" stroke="#D87895" stroke-width="1.5"/>

      <!-- Corazoncito de purpurina en el saquito -->
      <path d="M10 40 C7 35, 1 37, 3 42 C5 46, 10 50, 10 50 C10 50, 15 46, 17 42 C19 37, 13 35, 10 40 Z" fill="#FFFFFF" opacity="0.9"/>
      <text x="10" y="58" font-family="'Playfair Display', Georgia, serif" font-size="8" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">EMMA</text>
    </g>

    <!-- Estrellitas doradas mágicas flotando -->
    <g fill="#D4AF37" opacity="0.85">
      <path d="M70 45 L72 50 L77 52 L72 54 L70 59 L68 54 L63 52 L68 50 Z"/>
      <path d="M230 195 L231 198 L234 199 L231 200 L230 203 L229 200 L226 199 L229 198 Z"/>
      <path d="M260 90 L261 93 L264 94 L261 95 L260 98 L259 95 L256 94 L259 93 Z"/>
    </g>
  </g>
</svg>
